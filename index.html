<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matchup Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#070B11; --surface:#111925; --surface2:#0C131C;
 --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.14);
 --tx:#E9EFF6; --mut:#7F92A6;
 --home:#FFA23A; --away:#3DD6E8;
 --homeD:rgba(255,162,58,.16); --awayD:rgba(61,214,232,.16);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.5;
 -webkit-font-smoothing:antialiased;
 background-image:radial-gradient(900px 460px at 12% -8%,rgba(255,162,58,.10),transparent 62%),
                  radial-gradient(900px 460px at 88% -8%,rgba(61,214,232,.10),transparent 62%);
 background-attachment:fixed}
.wrap{max-width:1120px;margin:0 auto;padding:26px 20px 70px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;
 flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line2);margin-bottom:22px}
h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:46px;margin:0;
 line-height:.9;letter-spacing:.005em;text-transform:uppercase;
 background:linear-gradient(96deg,var(--home) 8%,#fff 46%,var(--away) 92%);
 -webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--mut);
 letter-spacing:.13em;text-transform:uppercase;margin-top:7px}
.seg{display:flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden;background:var(--surface2)}
.seg button{background:none;border:0;padding:9px 18px;cursor:pointer;color:var(--mut);
 font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:600;
 text-transform:uppercase;letter-spacing:.07em;transition:.18s}
.seg button.act{background:var(--tx);color:#070B11}
.seg button:not(.act):hover{color:var(--tx)}
.controls{display:grid;grid-template-columns:1fr 44px 1fr;gap:12px;align-items:end;margin-bottom:14px}
label{display:block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.14em;
 text-transform:uppercase;color:var(--mut);margin-bottom:6px}
select,input[type=number]{width:100%;padding:11px 12px;background:var(--surface);
 border:1px solid var(--line2);border-radius:6px;color:var(--tx);font-size:15px;
 font-weight:500;font-family:Inter,sans-serif}
select:focus-visible,input:focus-visible,button:focus-visible,li:focus-visible{outline:2px solid var(--away);outline-offset:2px}
.vs{font-family:'Barlow Condensed',sans-serif;font-size:17px;color:var(--mut);
 text-align:center;padding-bottom:12px;text-transform:uppercase}
.opts{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:22px;
 font-size:13px;color:var(--mut)}
.opts .g{display:flex;align-items:center;gap:7px}
.opts input[type=number]{width:62px;padding:7px 9px}
.card{position:relative;background:linear-gradient(168deg,var(--surface),var(--surface2));
 border:1px solid var(--line2);border-radius:12px;padding:24px;margin-bottom:22px;overflow:hidden}
.card:before{content:'';position:absolute;inset:0;pointer-events:none;
 background:radial-gradient(560px 200px at 8% 0%,var(--homeD),transparent 70%),
            radial-gradient(560px 200px at 92% 0%,var(--awayD),transparent 70%)}
.card>*{position:relative}
.pcts{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.sd{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;min-width:0}
.sd .nm{display:block;font-size:16px;letter-spacing:.08em;color:var(--mut);font-weight:600;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sd .pc{font-family:'IBM Plex Mono',monospace;font-size:52px;font-weight:600;line-height:1.02;display:block}
.sd.h .pc{color:var(--home);text-shadow:0 0 34px rgba(255,162,58,.35)}
.sd.a{text-align:right}
.sd.a .pc{color:var(--away);text-shadow:0 0 34px rgba(61,214,232,.35)}
.bar{position:relative;height:13px;border-radius:7px;overflow:hidden;background:var(--away);
 box-shadow:inset 0 0 0 1px var(--line2)}
.bar .f{height:100%;background:linear-gradient(90deg,#FFB65E,var(--home));
 transition:width .42s cubic-bezier(.4,0,.2,1);box-shadow:2px 0 14px rgba(255,162,58,.5)}
.mid{position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:rgba(255,255,255,.42)}
.sub{margin-top:14px;padding-top:13px;border-top:1px solid var(--line);
 font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--mut);
 display:flex;gap:20px;flex-wrap:wrap;letter-spacing:.03em}
.sub b{color:var(--tx);font-weight:500}
.dist{display:grid;grid-template-columns:1fr auto 1fr;gap:9px 14px;align-items:center;margin-top:6px}
.dl{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--mut);
 text-align:center;letter-spacing:.1em}
.db{height:19px;border-radius:4px;position:relative;background:rgba(255,255,255,.05);overflow:hidden}
.db i{position:absolute;top:0;bottom:0;display:block;transition:width .4s cubic-bezier(.4,0,.2,1)}
.db.h i{right:0;background:linear-gradient(270deg,var(--home),rgba(255,162,58,.45))}
.db.a i{left:0;background:linear-gradient(90deg,var(--away),rgba(61,214,232,.45))}
.db span{position:absolute;top:1px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--tx)}
.db.h span{right:7px} .db.a span{left:7px}
.games{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
.gm{flex:1;min-width:62px;background:var(--surface2);border:1px solid var(--line);
 border-radius:7px;padding:8px 6px;text-align:center}
.gm .n{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--mut);letter-spacing:.1em}
.gm .v{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;
 text-transform:uppercase;margin:2px 0 1px}
.gm .p{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600}
.rosters{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.rc h2{font-family:'Barlow Condensed',sans-serif;font-size:18px;text-transform:uppercase;
 letter-spacing:.06em;margin:0 0 2px}
.rc.h h2{color:var(--home)} .rc.a h2{color:var(--away)}
.hint{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--mut);
 letter-spacing:.09em;text-transform:uppercase;margin-bottom:9px}
ul.pl{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
ul.pl li{display:flex;align-items:center;gap:10px;padding:9px 11px;cursor:pointer;
 border-bottom:1px solid var(--line);transition:background .13s}
ul.pl li:last-child{border-bottom:0}
ul.pl li:hover{background:rgba(255,255,255,.045)}
ul.pl li.off{opacity:.34}
ul.pl li.off .pn{text-decoration:line-through}
.sw{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:var(--mut)}
.rc.h li.on .sw{background:var(--home);box-shadow:0 0 9px rgba(255,162,58,.85)}
.rc.a li.on .sw{background:var(--away);box-shadow:0 0 9px rgba(61,214,232,.85)}
.pn{flex:1;font-size:14px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mn{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mut);width:38px;text-align:right}
.im{font-family:'IBM Plex Mono',monospace;font-size:12.5px;width:50px;text-align:right;font-weight:600}
.note{margin-top:26px;padding:18px;background:var(--surface2);border:1px solid var(--line);
 border-radius:10px;font-size:12.5px;color:var(--mut);line-height:1.7}
.note b{color:var(--tx);font-weight:600}
.rst{background:none;border:1px solid var(--line2);border-radius:6px;padding:7px 13px;
 font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;
 text-transform:uppercase;color:var(--mut);cursor:pointer;transition:.16s}
.rst:hover{color:var(--tx);border-color:var(--tx)}
.hide{display:none}
@media(max-width:760px){
 .controls{grid-template-columns:1fr}.vs{display:none}.rosters{grid-template-columns:1fr}
 h1{font-size:34px}.sd .pc{font-size:38px}.pcts{gap:8px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

  $('#ap').textContent=(S.bWin*100).toFixed(1)+'%';
  $('#fill').style.width=(S.aWin*100).toFixed(1)+'%';
  const nl=[4,5,6,7],aML=nl[S.aLen.indexOf(Math.max(...S.aLen))],bML=nl[S.bLen.indexOf(Math.max(...S.bLen))];
  $('#sub').innerHTML='<span>Series odds from <b>20,000 simulations</b></span>'+
   '<span>Per game: <b>'+T.short+' '+(pH*100).toFixed(0)+'%</b> home &middot; <b>'+(pA*100).toFixed(0)+'%</b> away</span>'+
   '<span>Most likely: <b>'+(S.aWin>=S.bWin?T.short+' in '+aML:A.short+' in '+bML)+'</b></span>';
  const mxv=Math.max(...S.aLen,...S.bLen)||1;let d='';
  for(let i=0;i<4;i++){
   d+='<div class="db h"><i style="width:'+(S.aLen[i]/mxv*100)+'%"></i><span>'+(S.aLen[i]*100).toFixed(1)+'%</span></div>'+
      '<div class="dl">IN '+(i+4)+'</div>'+
      '<div class="db a"><i style="width:'+(S.bLen[i]/mxv*100)+'%"></i><span>'+(S.bLen[i]*100).toFixed(1)+'%</span></div>';}
  $('#dist').innerHTML=d;
  let g='';for(let i=0;i<7;i++){const at=VEN[i],p=at?pH:pA;
   g+='<div class="gm"><div class="n">GAME '+(i+1)+'</div><div class="v" style="color:'+(at?'var(--home)':'var(--away)')+'">@'+(at?T.short:A.short)+'</div>'+
      '<div class="p" style="color:'+(at?'var(--home)':'var(--away)')+'">'+(p*100).toFixed(0)+'%</div></div>';}
  $('#games').innerHTML=g;
 }
 const impLabel=mode==='series'?'change to series odds':'change to win probability';

 $('#hint2').textContent='Tap to rule out · number = '+impLabel;

 const f=B.fidelity;

  '<b>What the model knows.</b> Trained on every NBA game 1985-2026: team form, rest, travel, shot profile, and availability weighted by '+

  '<b>Honesty note.</b> The real model is 12 boosted ensembles and cannot run in a browser, so this is a distilled copy: '+
